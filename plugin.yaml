name: delegation-policy
version: 2.3.0
description: "Delegation policy for the main agent: the orchestrator routes, planning/review/heavy thinking go to a planner one-shot subagent, task execution to worker subagents. Model names are SETTINGS in config.yaml (delegation.roles for planner/reviewer, delegation.model for workers, model.default for the orchestrator) and are rendered into the policy text and the gate command once per new session; absent keys fall back to the historical GLM/DeepSeek split. The policy text lives in policy.md; a pre_tool_call hook enforces the plan/review entry points by blocking them until a planner pass exists. The heavy-thinking lane is voluntary (it has no tool signature) and escalates on rework. Model routing itself is not changed by this plugin."
author: "Ayman"
license: MIT
provides_hooks:
  - pre_tool_call
